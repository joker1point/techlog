# Inspired from https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml
name: GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Skip post checks (emergency deploy)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 文章检查需要 before/after 两个提交点做 git diff
      - name: 文章检查（变更 mdx：机械五项 + 新增文图文密度）
        if: ${{ github.event.inputs.skip_checks != 'true' }}
        run: python3 scripts/ci_check.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
      # 对外材料红线不加 skip_checks 逃生门：文章检查可以紧急跳过，品牌词/凭据泄漏不能
      # （确有误报就在该行加 `public-materials: ignore` 并写清理由）。
      - name: 对外材料红线（代理品牌词 / 凭据）
        run: python3 tools/check_public_materials.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - id: configurepages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - run: yarn
      - run: yarn build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
